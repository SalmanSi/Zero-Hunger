name: Deploy backend to EC2

on:
  push:
    branches: [main]
    paths:
      - 'backend/**'
      - '.github/workflows/deploy-backend.yml'
  workflow_dispatch:

concurrency:
  group: deploy-backend
  cancel-in-progress: false

jobs:
  deploy:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Validate required secrets
        env:
          EC2_HOST: ${{ secrets.EC2_HOST }}
          EC2_USER: ${{ secrets.EC2_USER }}
          EC2_SSH_KEY: ${{ secrets.EC2_SSH_KEY }}
          EC2_APP_DIR: ${{ secrets.EC2_APP_DIR }}
        run: |
          missing=0
          for v in EC2_HOST EC2_USER EC2_SSH_KEY EC2_APP_DIR; do
            if [ -z "${!v}" ]; then
              echo "::error::Required secret $v is not set"
              missing=1
            fi
          done
          [ "$missing" -eq 0 ] || exit 1

      # The EC2 box runs the backend in-place from a git clone (pm2 process
      # "zerohunger-api", script dist/index.js). Deploy = fast-forward to the
      # pushed commit, reinstall deps, rebuild, and restart. The untracked
      # backend/.env on the server is preserved across deploys.
      - name: Deploy over SSH
        uses: appleboy/ssh-action@v1.2.0
        with:
          host: ${{ secrets.EC2_HOST }}
          username: ${{ secrets.EC2_USER }}
          key: ${{ secrets.EC2_SSH_KEY }}
          command_timeout: 12m
          script: |
            set -euo pipefail
            APP_DIR="${{ secrets.EC2_APP_DIR }}"
            cd "$APP_DIR"
            git fetch origin main
            git reset --hard origin/main
            cd backend
            npm ci
            npx prisma generate
            npm run build
            pm2 restart zerohunger-api --update-env || pm2 start dist/index.js --name zerohunger-api
            pm2 save

      - name: Health check
        run: |
          URL="https://${{ secrets.EC2_HOST }}.sslip.io/api/health"
          for i in 1 2 3 4 5; do
            if curl -fsS -m 8 "$URL" > /dev/null; then
              echo "Health check passed: $URL"
              exit 0
            fi
            echo "Attempt $i failed, retrying..."
            sleep 4
          done
          echo "::error::Health check failed against $URL"
          exit 1
